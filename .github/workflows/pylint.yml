name: Pylint

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - "requirements/**"
      - ".pylintrc"
      - "pylintrc"
      - "requirements-lint.txt"
      - "setup.cfg"
      - ".github/workflows/pylint.yml"
  pull_request:
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - "requirements/**"
      - ".pylintrc"
      - "pylintrc"
      - "requirements-lint.txt"
      - "setup.cfg"
      - ".github/workflows/pylint.yml"

permissions:
  contents: read

concurrency:
  group: pylint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Pylint (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and lint dependencies
        run: python -m pip install numpy python-docx pytest "pylint==3.3.9"
      - name: Lint Python code
        shell: bash
        run: |
          mapfile -d '' files < <(git ls-files -z '*.py')
          # Keep repository lint rules and import checks; target Python 3.9.
          python -m pylint --py-version=3.9 "${files[@]}"
